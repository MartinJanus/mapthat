name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check || {
            npx prettier --write src/features/places/google-model.ts src/features/places/google.ts src/features/instagram/place-cards.ts tests/places/google-matching-regressions.test.ts tests/places/google-fixtures.ts tests/places/google.test.ts tests/places/google-photos.test.ts tests/places/place-card-regressions.test.ts src/features/places/gemini.ts src/features/instagram/webhook.ts tests/places/caption.test.ts tests/instagram/reel-messages.test.ts docs/instagram-reel-capture.md
            git diff
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
